<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>互动叙事编辑器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="toolbar">
  <span class="brand">互动叙事编辑器</span>
  <input id="project-title" class="field title-field" type="text" placeholder="作品名" title="作品名（阅读器标题）">
  <span class="spacer"></span>
  <div class="segmented" id="view-switch">
    <button type="button" data-view="list">列表</button>
    <button type="button" data-view="graph">节点图</button>
    <button type="button" data-view="variables">变量</button>
  </div>
  <button id="btn-preview" class="btn primary" type="button" title="Ctrl+Enter">试玩</button>
  <button id="btn-new" class="btn" type="button">新建</button>
  <button id="btn-import" class="btn" type="button">导入</button>
  <button id="btn-export-json" class="btn" type="button">导出 JSON</button>
  <button id="btn-export-html" class="btn accent" type="button">导出 HTML</button>
  <input id="file-input" type="file" accept=".json,application/json" hidden>
</header>

<main class="workspace">
  <aside class="sidebar">
    <div class="sidebar-head">
      <input id="node-search" class="field" type="search" placeholder="搜索节点标题 / 正文">
      <button id="btn-add-node" class="btn small" type="button">+ 新建节点</button>
    </div>
    <div id="node-list" class="node-list"></div>
    <div class="sidebar-foot">
      <span id="node-count" class="muted"></span>
    </div>
  </aside>

  <section class="main">
    <div id="view-list" class="view"></div>
    <div id="view-graph" class="view" hidden></div>
    <div id="view-variables" class="view" hidden></div>
  </section>
</main>

<footer class="statusbar">
  <span id="status-text" class="muted"></span>
  <span class="spacer"></span>
  <button id="btn-issues" class="btn small" type="button">校验：0 错误 / 0 警告</button>
  <span id="save-state" class="muted"></span>
</footer>

<div id="issues-panel" class="issues-panel" hidden></div>
<div id="preview-overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="../core/story-engine.js"></script>
<script src="../core/engine-source.js"></script>
<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/condition-ui.js"></script>
<script src="js/store.js"></script>
<script src="js/view-list.js"></script>
<script src="js/view-graph.js"></script>
<script src="js/view-variables.js"></script>
<script src="js/view-preview.js"></script>
<script src="js/reader-template.js"></script>
<script src="js/exporter.js"></script>
<script src="js/io.js"></script>
<script src="js/app.js"></script>
</body>
</html>
